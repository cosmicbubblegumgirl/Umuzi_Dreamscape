<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Umuzi Dreamscape</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #13211c;
        --muted: #64716b;
        --leaf: #15a56f;
        --gold: #f7c64a;
        --sky: #8fd7ff;
        --paper: #fffdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(143, 215, 255, 0.5), transparent 32rem),
          radial-gradient(circle at bottom right, rgba(21, 165, 111, 0.24), transparent 28rem),
          linear-gradient(135deg, #fffdf8 0%, #eef9f4 100%);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      main {
        width: min(34rem, calc(100vw - 2rem));
        display: grid;
        gap: 1.25rem;
        justify-items: center;
        text-align: center;
      }

      .mark {
        width: 6.25rem;
        height: 6.25rem;
        border-radius: 1.5rem;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, var(--leaf), #0b6f5d);
        box-shadow: 0 1.25rem 3rem rgba(16, 88, 72, 0.28);
        position: relative;
        overflow: hidden;
      }

      .mark::before {
        content: "";
        position: absolute;
        inset: 0.8rem;
        border-radius: 999px 999px 999px 0.75rem;
        border: 0.32rem solid rgba(255, 255, 255, 0.92);
        transform: rotate(-12deg);
      }

      .mark::after {
        content: "";
        position: absolute;
        width: 2rem;
        height: 2rem;
        right: 1.2rem;
        top: 1rem;
        border-radius: 50%;
        background: var(--gold);
        box-shadow:
          -1.8rem 2.1rem 0 -0.35rem var(--sky),
          0.8rem 2.4rem 0 -0.55rem rgba(255, 255, 255, 0.95);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 12vw, 4.5rem);
        line-height: 0.94;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        max-width: 27rem;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
      }

      .status {
        border: 1px solid rgba(19, 33, 28, 0.1);
        border-radius: 0.75rem;
        padding: 0.8rem 1rem;
        background: rgba(255, 255, 255, 0.72);
        color: #244037;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>Umuzi Dreamscape</h1>
      <p>
        The mobile shell is ready. Connect it to the running web app or a hosted
        Dreamscape URL to load the full learner workspace.
      </p>
      <div class="status">Created by quantum_cupcake</div>
    </main>
  </body>
</html>
